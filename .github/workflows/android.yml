name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # 1. تنزيل المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. تثبيت Gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. التحقق من ملفات المشروع
      - name: Check project
        run: |
          echo "Project files:"
          ls -la
          echo ""
          echo "App files:"
          ls -la app
          echo ""
          echo "Gradle version:"
          gradle --version

      # 5. بناء APK
      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      # 6. التأكد من إنشاء APK
      - name: Check APK
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      # 7. رفع APK كملف قابل للتنزيل
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: image-to-pdf-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
